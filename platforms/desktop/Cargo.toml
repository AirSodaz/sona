[package]
name = "sona"
version.workspace = true
description = "Sona - A privacy-first, offline transcript editor"
authors.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sona"

[package.metadata.sona]
role = "host"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sona_desktop_lib"
crate-type = ["rlib"]

[dependencies]
sona-application = { workspace = true }
sona-audio-capture = { workspace = true }
sona-archive = { workspace = true }
sona-api-server = { workspace = true }
sona-core = { workspace = true }
sona-export = { workspace = true }
sona-sherpa-onnx = { workspace = true }
sona-vad = { workspace = true }
sona-punct = { workspace = true }
sona-llama-cpp = { workspace = true }
sona-media-detector = { workspace = true }
sona-model-downloads = { workspace = true }
sona-online-llm = { workspace = true }
sona-online-asr = { workspace = true }
sona-recovery-fs = { workspace = true }
sona-runtime-fs = { workspace = true }
sona-sqlite = { workspace = true }
sona-sync = { workspace = true }
sona-sync-webdav = { workspace = true }
sona-sync-s3 = { workspace = true }
sona-translation-onnx = { workspace = true }
sona-ts-bind = { workspace = true }

# Pure Rust GUI Framework (GPUI Kit)
gpui-kit = "0.9.0"

# Pure Rust Desktop Integrations
tray-icon = "0.26"
muda = "0.21"
global-hotkey = "0.9"
auto-launch = "0.6"
single-instance = "0.3"
open = "5.4"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

# Async Runtime & Core Utilities
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cpal = { workspace = true }
enigo = "0.6"
futures-util = { workspace = true }
keyring = "4.1.5"
log = { workspace = true }
notify = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls", "json", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }

[features]
llama-vulkan = ["sona-llama-cpp/vulkan"]
llama-metal = ["sona-llama-cpp/metal"]
