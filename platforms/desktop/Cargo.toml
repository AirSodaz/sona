[package]
name = "sona"
version.workspace = true
description = "Sona - A privacy-first, offline transcript editor"
authors.workspace = true
edition.workspace = true
default-run = "sona"

[package.metadata.sona]
role = "host"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_appsona_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
sona-application = { workspace = true }
sona-archive = { workspace = true }
sona-api-server = { workspace = true }
sona-core = { workspace = true }
sona-export = { workspace = true }
sona-sherpa-onnx = { workspace = true }
sona-vad = { workspace = true }
sona-punct = { workspace = true }
sona-llama-cpp = { workspace = true }
sona-media-detector = { workspace = true }
sona-model-downloads = { workspace = true }
sona-online-llm = { workspace = true }
sona-online-asr = { workspace = true }
sona-recovery-fs = { workspace = true }
sona-runtime-fs = { workspace = true }
sona-sqlite = { workspace = true }
sona-sync = { workspace = true }
sona-sync-webdav = { workspace = true }
sona-ts-bind = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
toml = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
base64 = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
ringbuf = { workspace = true }
tauri-plugin-process = "2"
uuid = { workspace = true }
tauri-plugin-log = "2"
log = { workspace = true }
tauri-plugin-single-instance = "2"
enigo = "0.6"
tauri-plugin-global-shortcut = "2"
tauri-plugin-prevent-default = "5.0.0"
chrono = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
unicode-normalization = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true, features = ["multipart", "macros", "ws"] }
keyring = "4.1.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[features]
llama-vulkan = ["sona-llama-cpp/vulkan"]
llama-metal = ["sona-llama-cpp/metal"]
