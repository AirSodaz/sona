[package]
name = "sona-uniffi-bind"
version.workspace = true
description = "UniFFI-facing host binding for Sona core"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "host"

[lib]
name = "sona_uniffi_bind"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
log = "0.4.22"
serde = "1"
serde_json = "1"
sona-application = { path = "../../application" }
sona-archive = { path = "../../adapters/archive" }
sona-core = { path = "../../core" }
sona-export = { path = "../../adapters/export" }
sona-sherpa-onnx = { path = "../../providers/asr/local/sherpa_onnx" }
sona-model-downloads = { path = "../../adapters/model_downloads" }
sona-online-asr = { path = "../../providers/asr/online" }
sona-online-llm = { path = "../../adapters/online_llm" }
sona-recovery-fs = { path = "../../adapters/recovery_fs" }
sona-runtime-fs = { path = "../../adapters/runtime_fs" }
sona-sqlite = { path = "../../adapters/sqlite" }
sona-sync = { path = "../../application/sync" }
sona-sync-webdav = { path = "../../adapters/sync_webdav" }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
uniffi = { version = "0.32", features = ["tokio"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
