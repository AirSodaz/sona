[package]
name = "sona-uniffi-bind"
version.workspace = true
description = "UniFFI-facing host binding for Sona core"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "host"

[lib]
name = "sona_uniffi_bind"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sona-application = { workspace = true }
sona-archive = { workspace = true }
sona-core = { workspace = true }
sona-export = { workspace = true }
sona-sherpa-onnx = { workspace = true }
sona-vad = { workspace = true }
sona-punct = { workspace = true }
sona-model-downloads = { workspace = true }
sona-online-asr = { workspace = true }
sona-online-llm = { workspace = true }
sona-recovery-fs = { workspace = true }
sona-runtime-fs = { workspace = true }
sona-sqlite = { workspace = true }
sona-sync = { workspace = true }
sona-sync-webdav = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
uniffi = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
