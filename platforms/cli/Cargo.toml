[package]
name = "sona-cli"
version.workspace = true
description = "Standalone command line interface for Sona core"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[package.metadata.sona]
role = "host"

[dependencies]
clap = { workspace = true }
cpal = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rubato = { workspace = true }
ringbuf = { workspace = true }
sona-application = { workspace = true }
sona-api-server = { workspace = true }
sona-sherpa-onnx = { workspace = true }
sona-vad = { workspace = true }
sona-punct = { workspace = true }
sona-llama-cpp = { workspace = true }
sona-media-detector = { workspace = true }
sona-model-downloads = { workspace = true }
sona-online-asr = { workspace = true }
sona-runtime-fs = { workspace = true }
sona-core = { workspace = true }
sona-export = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[features]
llama-vulkan = ["sona-llama-cpp/vulkan"]
llama-metal = ["sona-llama-cpp/metal"]
