[package]
name = "sona-cli"
version.workspace = true
description = "Standalone command line interface for Sona core"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[package.metadata.sona]
role = "host"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
cpal = "0.18"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = "0.16"
ringbuf = "0.4"
sona-application = { path = "../../application" }
sona-api-server = { path = "../../adapters/api_server" }
sona-local-asr = { path = "../../adapters/local_asr" }
sona-llama-asr = { path = "../../adapters/llama_asr" }
sona-media-detector = { path = "../../adapters/media_detector" }
sona-model-downloads = { path = "../../adapters/model_downloads" }
sona-online-asr = { path = "../../adapters/online_asr" }
sona-runtime-fs = { path = "../../adapters/runtime_fs" }
sona-core = { path = "../../core" }
sona-export = { path = "../../adapters/export" }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[dev-dependencies]
async-trait = "0.1"
hex = "0.4"
sha2 = "0.11"
tempfile = "3"
