[package]
name = "sona-online-asr"
version.workspace = true
description = "Reusable online ASR provider adapters for Sona"
authors.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.sona]
role = "provider"

[dependencies]
aimux-core = "0.3.0"
aimux-providers = "0.3.0"
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
sona-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid = { workspace = true }
