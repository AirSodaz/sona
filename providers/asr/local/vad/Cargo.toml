[package]
name = "sona-vad"
version.workspace = true
description = "Voice activity detection provider for Sona"
authors.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.sona]
role = "provider"

[dependencies]
log = { workspace = true }
sona-core = { workspace = true }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs", "ndarray"] }
ndarray = { version = "0.16", default-features = false }
