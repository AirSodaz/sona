[package]
name = "sona-sherpa-onnx"
version.workspace = true
description = "Reusable local offline ASR adapter for Sona"
authors.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[package.metadata.sona]
role = "provider"

[dependencies]
async-trait = { workspace = true }
hound = "3.5.1"
log = { workspace = true }
sona-core = { workspace = true }
sherpa-onnx = { workspace = true }
sherpa-onnx-sys = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "fs", "io-util", "sync", "time"] }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
