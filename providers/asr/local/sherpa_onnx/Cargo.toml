[package]
name = "sona-sherpa-onnx"
version.workspace = true
description = "Reusable local offline ASR adapter for Sona"
authors.workspace = true
edition.workspace = true
build = "build.rs"

[package.metadata.sona]
role = "provider"

[dependencies]
async-trait = { workspace = true }
glob = { workspace = true }
hound = "3.5.1"
log = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sona-core = { workspace = true }
sherpa-onnx = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "fs", "io-util", "sync"] }
walkdir = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
