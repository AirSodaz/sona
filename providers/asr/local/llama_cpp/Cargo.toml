[package]
name = "sona-llama-cpp"
version.workspace = true
description = "llama.cpp batch ASR adapter for Qwen3-ASR"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "provider"

[dependencies]
async-trait = "0.1"
encoding_rs = "0.8"
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["dynamic-link", "mtmd"] }
log = "0.4"
sona-core = { path = "../../../../core" }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[features]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
