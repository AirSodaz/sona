[package]
name = "sona-llama-cpp"
version.workspace = true
description = "llama.cpp batch ASR adapter for Qwen3-ASR"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "provider"

[dependencies]
async-trait = { workspace = true }
encoding_rs = { workspace = true }
llama-cpp-2 = { version = "=0.1.154", default-features = false, features = ["dynamic-link", "mtmd"] }
log = { workspace = true }
sona-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true }

[features]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
