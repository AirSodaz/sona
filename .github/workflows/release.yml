name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-android-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Android release version
        id: version
        run: |
          PROJECT_VERSION=$(node -p "require('./package.json').version")
          VERSION_NAME="$PROJECT_VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/android-update-manifest.js validate-release \
              --tag "${GITHUB_REF_NAME}" \
              --project-version "$PROJECT_VERSION"
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android-client:
    needs: prepare-android-version
    permissions:
      contents: read
    uses: ./.github/workflows/android-client.yml
    with:
      artifact_prefix: release-assets-android
      channel: stable
      version_name: ${{ needs.prepare-android-version.outputs.version_name }}
      version_code: ${{ needs.prepare-android-version.outputs.version_code }}

  build-tauri:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-client.yml
    with:
      artifact_prefix: release-assets-desktop
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish-release:
    needs: [prepare-android-version, build-tauri, android-client]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Download all artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          pattern: "release-assets-*"
          merge-multiple: true

      - name: Verify Android release artifacts
        run: |
          for apk in \
            app-arm64-v8a-debug.apk \
            app-x86_64-debug.apk \
            app-arm64-v8a-release-unsigned.apk \
            app-x86_64-release-unsigned.apk; do
            count=$(find all-artifacts -type f -name "$apk" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one $apk, found $count"
              exit 1
            fi
          done

      - name: Extract Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          RAW_VERSION="${VERSION#v}"
          echo "Extracting release notes for version $VERSION"

          cat <<EOF > release_notes.md
          ## Download

          **Windows**
          [x64](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_x64-setup.exe) | [ARM64](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_arm64-setup.exe)

          **macOS**
          [Apple Silicon](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_aarch64.dmg) | [Intel](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_x64.dmg)

          **Linux**
          [DEB](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_amd64.deb) | [RPM](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona-${RAW_VERSION}-1.x86_64.rpm) | [AppImage](https://github.com/AirSodaz/sona/releases/download/$VERSION/Sona_${RAW_VERSION}_amd64.AppImage)

          **Android (preview builds)**
          Debug-signed: [ARM64](https://github.com/AirSodaz/sona/releases/download/$VERSION/app-arm64-v8a-debug.apk) | [x86_64](https://github.com/AirSodaz/sona/releases/download/$VERSION/app-x86_64-debug.apk)
          Unsigned release: [ARM64](https://github.com/AirSodaz/sona/releases/download/$VERSION/app-arm64-v8a-release-unsigned.apk) | [x86_64](https://github.com/AirSodaz/sona/releases/download/$VERSION/app-x86_64-release-unsigned.apk)
          EOF

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"
          APP_NAME="Sona"

          # Helper: read signature content from .sig file in artifacts
          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          # Helper: find filename
          find_filename() {
            local pattern="$1"
            local file
            file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$file" ]; then
                basename "$file"
            else
                echo ""
            fi
          }

          # Read signatures for each platform
          MACOS_AARCH64_SIG=$(read_sig "*_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(read_sig "*_x64.app.tar.gz.sig")
          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          WINDOWS_ARM64_NSIS_SIG=$(read_sig "*_arm64-setup.exe.sig")
          WINDOWS_MSI_SIG=$(read_sig "*_x64_en-US.msi.sig")
          WINDOWS_ARM64_MSI_SIG=$(read_sig "*_arm64_en-US.msi.sig")
          LINUX_AMD64_SIG=$(read_sig "*_amd64.AppImage.sig")
          LINUX_AARCH64_SIG=$(read_sig "*_aarch64.AppImage.sig")

          echo "Signatures found:"
          [ -n "$MACOS_AARCH64_SIG" ] && echo "  macOS aarch64: YES" || echo "  macOS aarch64: NO"
          [ -n "$MACOS_X64_SIG" ] && echo "  macOS x64: YES" || echo "  macOS x64: NO"
          [ -n "$WINDOWS_NSIS_SIG" ] && echo "  Windows x64 EXE: YES" || echo "  Windows x64 EXE: NO"
          [ -n "$WINDOWS_ARM64_NSIS_SIG" ] && echo "  Windows arm64 EXE: YES" || echo "  Windows arm64 EXE: NO"
          [ -n "$WINDOWS_MSI_SIG" ] && echo "  Windows x64 MSI: YES" || echo "  Windows x64 MSI: NO"
          [ -n "$WINDOWS_ARM64_MSI_SIG" ] && echo "  Windows arm64 MSI: YES" || echo "  Windows arm64 MSI: NO"
          [ -n "$LINUX_AMD64_SIG" ] && echo "  Linux amd64: YES" || echo "  Linux amd64: NO"

          # Find filenames to construct URLs accurately
          MACOS_AARCH64_FILE=$(find_filename "*_aarch64.app.tar.gz")
          MACOS_X64_FILE=$(find_filename "*_x64.app.tar.gz")
          WINDOWS_NSIS_FILE=$(find_filename "*_x64-setup.exe")
          WINDOWS_ARM64_NSIS_FILE=$(find_filename "*_arm64-setup.exe")
          WINDOWS_MSI_FILE=$(find_filename "*_x64_en-US.msi")
          WINDOWS_ARM64_MSI_FILE=$(find_filename "*_arm64_en-US.msi")
          LINUX_AMD64_FILE=$(find_filename "*_amd64.AppImage")

          # Fallback if find fails but sig exists (unlikely)
          [ -z "$MACOS_AARCH64_FILE" ] && MACOS_AARCH64_FILE="${APP_NAME}_aarch64.app.tar.gz"
          [ -z "$MACOS_X64_FILE" ] && MACOS_X64_FILE="${APP_NAME}_x64.app.tar.gz"
          [ -z "$WINDOWS_NSIS_FILE" ] && WINDOWS_NSIS_FILE="${APP_NAME}_${VER}_x64-setup.exe"
          [ -z "$WINDOWS_ARM64_NSIS_FILE" ] && WINDOWS_ARM64_NSIS_FILE="${APP_NAME}_${VER}_arm64-setup.exe"
          [ -z "$WINDOWS_MSI_FILE" ] && WINDOWS_MSI_FILE="${APP_NAME}_${VER}_x64_en-US.msi"
          [ -z "$WINDOWS_ARM64_MSI_FILE" ] && WINDOWS_ARM64_MSI_FILE="${APP_NAME}_${VER}_arm64_en-US.msi"
          [ -z "$LINUX_AMD64_FILE" ] && LINUX_AMD64_FILE="${APP_NAME}_${VER}_amd64.AppImage"

          # Build updater.json
          jq -n \
            --arg version "$VER" \
            --arg notes "See release page for details" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg mac_a64_sig "$MACOS_AARCH64_SIG" \
            --arg mac_x64_sig "$MACOS_X64_SIG" \
            --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
            --arg win_arm64_nsis_sig "$WINDOWS_ARM64_NSIS_SIG" \
            --arg win_msi_sig "$WINDOWS_MSI_SIG" \
            --arg win_arm64_msi_sig "$WINDOWS_ARM64_MSI_SIG" \
            --arg linux_amd64_sig "$LINUX_AMD64_SIG" \
            --arg mac_a64_file "$MACOS_AARCH64_FILE" \
            --arg mac_x64_file "$MACOS_X64_FILE" \
            --arg win_nsis_file "$WINDOWS_NSIS_FILE" \
            --arg win_arm64_nsis_file "$WINDOWS_ARM64_NSIS_FILE" \
            --arg win_msi_file "$WINDOWS_MSI_FILE" \
            --arg win_arm64_msi_file "$WINDOWS_ARM64_MSI_FILE" \
            --arg linux_amd64_file "$LINUX_AMD64_FILE" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: "\($dl)/\($mac_a64_file)",
                  signature: $mac_a64_sig
                },
                "darwin-x86_64": {
                  url: "\($dl)/\($mac_x64_file)",
                  signature: $mac_x64_sig
                },
                "windows-x86_64": {
                  url: "\($dl)/\($win_nsis_file)",
                  signature: $win_nsis_sig
                },
                "windows-aarch64": {
                  url: "\($dl)/\($win_arm64_nsis_file)",
                  signature: $win_arm64_nsis_sig
                },
                "linux-x86_64": {
                  url: "\($dl)/\($linux_amd64_file)",
                  signature: $linux_amd64_sig
                }
              }
            }' > updater.json

          # Clean up empty platforms keys if signature is missing (optional but good practice)
          # jq filters or just let it be (Tauri might ignore empty sigs or user ensures they exist)

          echo "Generated updater.json:"
          cat updater.json

      - name: Build Android update manifest
        run: |
          node scripts/android-update-manifest.js generate \
            --channel stable \
            --version-name "${{ needs.prepare-android-version.outputs.version_name }}" \
            --version-code "${{ needs.prepare-android-version.outputs.version_code }}" \
            --output android-update.json

      - name: Collect release artifact paths
        id: release-artifacts
        run: |
          {
            echo "paths<<EOF"
            find all-artifacts -type f -print
            echo "updater.json"
            echo "android-update.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          allowUpdates: true
          name: "Sona ${{ github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.release-artifacts.outputs.paths }}
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          makeLatest: legacy