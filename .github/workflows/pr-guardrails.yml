name: PR Guardrails

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm run lint:ci

      - name: Run tests
        run: pnpm run test:ci

      - name: Run script tests
        run: pnpm run test:scripts

      - name: Run build
        run: pnpm run build:ci

  rust-backend:
    name: Rust Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils libasound2-dev llvm-dev libclang-dev clang mold

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache llama.cpp CMake build directory
        id: cache-llama-cpp
        uses: actions/cache@v4
        with:
          path: |
            target/**/build/llama-cpp-sys-*
          key: llama-cpp-rust-backend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            llama-cpp-rust-backend-${{ runner.os }}-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests (excluding desktop host crate)
        run: cargo test -p sona-core -p sona-application -p sona-api-server -p sona-archive -p sona-export -p sona-sherpa-onnx -p sona-vad -p sona-punct -p sona-llama-cpp -p sona-media-detector -p sona-model-downloads -p sona-online-llm -p sona-online-asr -p sona-recovery-fs -p sona-runtime-fs -p sona-sqlite -p sona-sync -p sona-sync-webdav -p sona-ts-bind -p sona-uniffi-bind -p sona-cli

      - name: Compile desktop tests
        run: cargo test --manifest-path platforms/desktop/Cargo.toml --no-run

      - name: Run desktop tests
        run: |
          cargo test -p sona --test recovery_repository
          cargo test --manifest-path platforms/desktop/Cargo.toml --test desktop_entry
          cargo test -p sona-core --test preset_models
          cargo test --manifest-path platforms/desktop/Cargo.toml --lib app::server::tests


      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats
  android-backend:
    name: Android Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK setup
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-37.0
            ndk;29.0.14206865

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Run Android UniFFI Gradle smoke
        env:
          SONA_ANDROID_ABIS: arm64-v8a
        run: pnpm run verify:android-uniffi:gradle

      - name: Run Android client verification
        env:
          SONA_ANDROID_ABIS: arm64-v8a,x86_64
        run: pnpm run verify:android-client

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats
