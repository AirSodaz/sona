name: Desktop Client

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Artifact name prefix
        required: false
        type: string
        default: desktop-assets
      channel:
        description: Desktop build channel (stable or nightly); empty skips channel patching
        required: false
        type: string
        default: ""
      version_name:
        description: Version override passed to patch-channel.js
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-desktop-client:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --features llama-metal"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin --features llama-metal"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --features llama-vulkan"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc --features llama-vulkan"
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
    env:
      LLAMA_CPP_REF: b10405
      SHERPA_ONNX_VERSION: 1.13.8
      SHERPA_ONNX_TAG: v1.13.8
      LLAMA_BUILD_SHARED_LIBS: 1
      LLAMA_ENABLE_VULKAN: ${{ contains(matrix.args, 'llama-vulkan') && '1' || '0' }}
      LLAMA_ENABLE_METAL: ${{ contains(matrix.args, 'llama-metal') && '1' || '0' }}
      # Keep the CLI sidecar and Tauri host build on one Cargo target tree.
      # Use an absolute path because Tauri invokes Cargo from platforms/desktop.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vulkan SDK
        if: contains(matrix.args, 'llama-vulkan')
        uses: ./.github/actions/setup-vulkan-sdk

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils libasound2-dev llvm-dev libclang-dev clang libvulkan-dev libfuse2 zsync mold
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (contains(matrix.args, 'aarch64-pc-windows-msvc') && 'aarch64-pc-windows-msvc' || (contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '')) }}

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Patch channel version & identifiers
        if: inputs.channel != ''
        run: node platforms/desktop/scripts/patch-channel.js --channel "${{ inputs.channel }}" --version "${{ inputs.version_name }}"

      - name: Setup sherpa-onnx libraries
        uses: ./.github/actions/setup-sherpa-onnx
        with:
          version: ${{ env.SHERPA_ONNX_VERSION }}
          tag: ${{ env.SHERPA_ONNX_TAG }}
          target: ${{ matrix.args }}
          cache-key: sherpa-onnx-${{ env.SHERPA_ONNX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ strategy.job-index }}

      - name: Setup llama.cpp prebuilt libraries
        id: setup-llama
        uses: ./.github/actions/setup-llama-cpp-prebuilt
        with:
          ref: ${{ env.LLAMA_CPP_REF }}
          platform: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'aarch64-apple-darwin') && 'macos-arm64' || 'macos-x64') || (matrix.platform == 'ubuntu-22.04' && (contains(matrix.args, 'llama-vulkan') && 'linux-vulkan-x64' || 'linux-x64')) || (matrix.platform == 'windows-latest' && (contains(matrix.args, 'aarch64-pc-windows-msvc') && 'windows-cpu-arm64' || (contains(matrix.args, 'llama-vulkan') && 'windows-vulkan-x64' || 'windows-x64'))) }}

      - name: Configure llama.cpp library paths
        shell: bash
        run: |
          LIB_DIR="${{ steps.setup-llama.outputs.lib-dir }}"
          echo "LLAMA_CPP_LIB_DIR=$LIB_DIR" >> $GITHUB_ENV

          if [[ "${{ matrix.platform }}" == "macos-13" ]] || [[ "${{ matrix.platform }}" == "macos-14" ]]; then
            echo "DYLD_LIBRARY_PATH=$LIB_DIR:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          elif [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            echo "LD_LIBRARY_PATH=$LIB_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            # Windows uses PATH for DLL lookup
            if command -v cygpath &> /dev/null; then
              WIN_PATH=$(cygpath -w "$LIB_DIR")
            else
              WIN_PATH="$LIB_DIR"
            fi
            echo "$WIN_PATH" >> $GITHUB_PATH
          fi

      - name: Configure Windows build environment
        if: startsWith(matrix.platform, 'windows')
        uses: ./.github/actions/setup-windows-build-env

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LD_LIBRARY_PATH: ${{ env.LLAMA_CPP_LIB_DIR }}:${{ env.SHERPA_ONNX_LIB_DIR }}:${{ github.workspace }}/target/desktop-bundle/x86_64-unknown-linux-gnu/runtime-libs:${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release:${{ github.workspace }}/target/release${{ env.VULKAN_SDK != '' && format(':{0}/lib', env.VULKAN_SDK) || '' }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
        run: node platforms/desktop/scripts/tauri.js build ${{ matrix.args }} --verbose
      - name: Verify Tauri bundle and shared libraries
        run: node platforms/desktop/scripts/verify-tauri-bundle.js ${{ matrix.args }}

      - name: Rename macOS assets for architecture
        if: matrix.platform == 'macos-latest'
        run: |
          if [[ "${{ matrix.args }}" == *"--target aarch64-apple-darwin"* ]]; then
            ARCH="aarch64"
          elif [[ "${{ matrix.args }}" == *"--target x86_64-apple-darwin"* ]]; then
            ARCH="x64"
          else
            ARCH="unknown"
          fi

          echo "Detected architecture: $ARCH"
          cd target/*/release/bundle/macos/

          for f in *.app.tar.gz; do
            [ -f "$f" ] || continue
            base="${f%.app.tar.gz}"
            mv "$f" "${base}_${ARCH}.app.tar.gz"
            if [ -f "${f}.sig" ]; then
              mv "${f}.sig" "${base}_${ARCH}.app.tar.gz.sig"
            fi
          done

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/**/release/bundle/dmg/*.sig
            target/**/release/bundle/deb/*.sig
            target/**/release/bundle/appimage/*.sig
            target/**/release/bundle/msi/*.sig
            target/**/release/bundle/nsis/*.sig
            target/**/release/bundle/rpm/*.sig
          if-no-files-found: warn

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
