name: Desktop Client

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Artifact name prefix
        required: false
        type: string
        default: desktop-assets
      channel:
        description: Desktop build channel (stable or nightly); empty skips channel patching
        required: false
        type: string
        default: ""
      version_name:
        description: Version override passed to patch-channel.js
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-desktop-client:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --features llama-metal"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin --features llama-metal"
          - platform: "ubuntu-22.04"
            args: "--features llama-vulkan"
          - platform: "windows-latest"
            args: "--features llama-vulkan"
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
    env:
      SHERPA_ONNX_VERSION: 1.13.5
      SHERPA_ONNX_TAG: v1.13.5
      LLAMA_BUILD_SHARED_LIBS: 1
      LLAMA_ENABLE_VULKAN: ${{ contains(matrix.args, 'llama-vulkan') && '1' || '0' }}
      LLAMA_ENABLE_METAL: ${{ contains(matrix.args, 'llama-metal') && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vulkan SDK (Windows x64 Vulkan build)
        if: startsWith(matrix.platform, 'windows') && contains(matrix.args, 'llama-vulkan')
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $vulkanDir = "C:\VulkanSDK\$version"
          New-Item -ItemType Directory -Force -Path $vulkanDir | Out-Null
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile "VulkanSDK-Installer.exe"
          $7z = if (Get-Command 7z -ErrorAction SilentlyContinue) { "7z" } elseif (Test-Path "C:\Program Files\7-Zip\7z.exe") { "C:\Program Files\7-Zip\7z.exe" } else { "7z" }
          & $7z x VulkanSDK-Installer.exe -aoa -o"$vulkanDir"
          if ($LASTEXITCODE -ne 0) { throw "7z extraction of Vulkan SDK failed with exit code $LASTEXITCODE" }
          Remove-Item -Force "VulkanSDK-Installer.exe"
          "VULKAN_SDK=$vulkanDir" >> $env:GITHUB_ENV
          "$vulkanDir\Bin" >> $env:GITHUB_PATH

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils libasound2-dev llvm-dev libclang-dev clang libvulkan-dev glslang-tools

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (contains(matrix.args, 'aarch64-pc-windows-msvc') && 'aarch64-pc-windows-msvc' || (contains(matrix.args, 'aarch64') && 'aarch64-unknown-linux-gnu' || '')) }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: desktop-client-${{ matrix.platform }}-${{ strategy.job-index }}
          cache-on-failure: true

      - name: Enable Corepack
        run: corepack enable

      - name: Node.js setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch channel version & identifiers
        if: inputs.channel != ''
        run: node platforms/desktop/scripts/patch-channel.js --channel "${{ inputs.channel }}" --version "${{ inputs.version_name }}"

      - name: Download and extract sherpa-onnx shared libraries (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          wget https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_TAG}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared-lib.tar.bz2
          tar -xjf sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared-lib.tar.bz2
          echo "SHERPA_ONNX_LIB_DIR=${GITHUB_WORKSPACE}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared-lib/lib" >> $GITHUB_ENV

      - name: Download and extract sherpa-onnx shared libraries (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          wget https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_TAG}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared-lib.tar.bz2
          tar -xjf sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared-lib.tar.bz2
          echo "SHERPA_ONNX_LIB_DIR=${GITHUB_WORKSPACE}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-shared-lib/lib" >> $GITHUB_ENV

      - name: Download and extract sherpa-onnx shared libraries (Windows x64)
        if: startsWith(matrix.platform, 'windows') && !contains(matrix.args, 'aarch64-pc-windows-msvc')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/$env:SHERPA_ONNX_TAG/sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-x64-shared-MT-Release-lib.tar.bz2" -OutFile "sherpa-onnx-win.tar.bz2"
          tar -xjf sherpa-onnx-win.tar.bz2
          $libDir = Join-Path $env:GITHUB_WORKSPACE "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-x64-shared-MT-Release-lib\lib"
          "SHERPA_ONNX_LIB_DIR=$libDir" >> $env:GITHUB_ENV

      - name: Download and extract sherpa-onnx shared libraries (Windows ARM64)
        if: startsWith(matrix.platform, 'windows') && contains(matrix.args, 'aarch64-pc-windows-msvc')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/$env:SHERPA_ONNX_TAG/sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-arm64-shared-MT-Release-lib.tar.bz2" -OutFile "sherpa-onnx-win.tar.bz2"
          tar -xjf sherpa-onnx-win.tar.bz2
          $libDir = Join-Path $env:GITHUB_WORKSPACE "sherpa-onnx-v$env:SHERPA_ONNX_VERSION-win-arm64-shared-MT-Release-lib\lib"
          "SHERPA_ONNX_LIB_DIR=$libDir" >> $env:GITHUB_ENV

      - name: Configure RUSTFLAGS
        if: startsWith(matrix.platform, 'ubuntu') || startsWith(matrix.platform, 'macos')
        run: |
          echo "RUSTFLAGS=-L native=$SHERPA_ONNX_LIB_DIR" >> $GITHUB_ENV

      - name: Configure Windows ARM64 Clang
        if: contains(matrix.args, 'aarch64-pc-windows-msvc')
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV
          clang-cl --version
          ninja --version

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LD_LIBRARY_PATH: ${{ env.SHERPA_ONNX_LIB_DIR }}
        run: node platforms/desktop/scripts/tauri.js build ${{ matrix.args }}

      - name: Verify Tauri bundle and shared libraries
        run: node platforms/desktop/scripts/verify-tauri-bundle.js ${{ matrix.args }}

      - name: Rename macOS assets for architecture
        if: matrix.platform == 'macos-latest'
        run: |
          if [[ "${{ matrix.args }}" == *"--target aarch64-apple-darwin"* ]]; then
            ARCH="aarch64"
          elif [[ "${{ matrix.args }}" == *"--target x86_64-apple-darwin"* ]]; then
            ARCH="x64"
          else
            ARCH="unknown"
          fi

          echo "Detected architecture: $ARCH"
          cd target/*/release/bundle/macos/

          for f in *.app.tar.gz; do
            [ -f "$f" ] || continue
            base="${f%.app.tar.gz}"
            mv "$f" "${base}_${ARCH}.app.tar.gz"
            if [ -f "${f}.sig" ]; then
              mv "${f}.sig" "${base}_${ARCH}.app.tar.gz.sig"
            fi
          done

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/**/release/bundle/dmg/*.sig
            target/**/release/bundle/deb/*.sig
            target/**/release/bundle/appimage/*.sig
            target/**/release/bundle/msi/*.sig
            target/**/release/bundle/nsis/*.sig
            target/**/release/bundle/rpm/*.sig
          if-no-files-found: warn
