name: 'Setup Windows build environment'
description: 'Configure long paths, Ninja, Clang-cl, and short target directory junction on Windows'

runs:
  using: 'composite'
  steps:
    - name: Configure Windows build environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # 1. Disable Windows Defender real-time scanning & add exclusions for build tools/paths
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "C:\", "D:\", "T:\" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "sccache.exe", "clang-cl.exe", "lld-link.exe", "link.exe", "ninja.exe", "cmake.exe" -ErrorAction SilentlyContinue

        # 2. Configure C/C++ compiler and CMake/Ninja settings
        "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
        "CMAKE_OBJECT_PATH_MAX=1024" >> $env:GITHUB_ENV
        "CMAKE_BUILD_PARALLEL_LEVEL=4" >> $env:GITHUB_ENV
        "CC=clang-cl" >> $env:GITHUB_ENV
        "CXX=clang-cl" >> $env:GITHUB_ENV
        "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
        "CC_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
        "CXX_aarch64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
        "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV
        "CC_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
        "CXX_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
        "CXXFLAGS_x86_64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV

        # 3. Use lld-link (fast LLVM linker) for 3-5x faster linking on Windows
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" >> $env:GITHUB_ENV
        "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=lld-link" >> $env:GITHUB_ENV
        # Short path junction: target/ → C:\t avoids MAX_PATH issues with
        # deeply nested Cargo/CMake build trees on Windows.
        # Preserve any pre-existing target/ contents (e.g. restored cache).
        New-Item -ItemType Directory -Force -Path "C:\t" | Out-Null
        if (Test-Path "target") {
          if ((Get-Item "target").Attributes -band [IO.FileAttributes]::ReparsePoint) {
            Write-Host "target/ is already a junction — keeping it"
          } else {
            # Move restored cache contents into the junction target
            Write-Host "Moving existing target/ contents into C:\t"
            Get-ChildItem -Path "target" -Force | Move-Item -Destination "C:\t" -Force
            Remove-Item -Path "target" -Force
            cmd.exe /c "mklink /J target C:\t"
          }
        } else {
          cmd.exe /c "mklink /J target C:\t"
        }
        subst T: C:\t
        "CARGO_TARGET_DIR=T:\" >> $env:GITHUB_ENV
        clang-cl --version
        ninja --version
