name: 'Setup Vulkan SDK'
description: 'Install LunarG Vulkan SDK with SPIRV-Headers and configure environment'
inputs:
  version:
    description: 'Vulkan SDK version'
    required: false
    default: '1.3.296.0'

runs:
  using: 'composite'
  steps:
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $version = "${{ inputs.version }}"
        $vulkanDir = "C:\VulkanSDK\$version"
        curl.exe -sSfL --retry 5 --retry-connrefused --connect-timeout 30 "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -o "VulkanSDK-Installer.exe"
        $process = Start-Process -FilePath ".\VulkanSDK-Installer.exe" -ArgumentList "--root", $vulkanDir, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($process.ExitCode)" }
        Remove-Item -Force "VulkanSDK-Installer.exe"
        New-Item -ItemType Directory -Force -Path "$vulkanDir\Lib\cmake\SPIRV-Headers" | Out-Null
        Copy-Item "$vulkanDir\Lib\cmake\SPIRV-Headers*.cmake" "$vulkanDir\Lib\cmake\SPIRV-Headers\"
        New-Item -ItemType Directory -Force -Path "$vulkanDir\share\cmake\SPIRV-Headers" | Out-Null
        Copy-Item "$vulkanDir\Lib\cmake\SPIRV-Headers*.cmake" "$vulkanDir\share\cmake\SPIRV-Headers\"
        "VULKAN_SDK=$vulkanDir" >> $env:GITHUB_ENV
        "SPIRV-Headers_DIR=$vulkanDir\Lib\cmake" >> $env:GITHUB_ENV
        "CMAKE_PREFIX_PATH=$vulkanDir;$vulkanDir\Lib\cmake" >> $env:GITHUB_ENV
        "$vulkanDir\Bin" >> $env:GITHUB_PATH

    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        VULKAN_DIR="${HOME}/vulkan/${VERSION}/x86_64"
        mkdir -p "${HOME}/vulkan"
        wget -q "https://sdk.lunarg.com/sdk/download/${VERSION}/linux/vulkansdk-linux-x86_64-${VERSION}.tar.xz" -O vulkansdk-linux.tar.xz
        tar -xf vulkansdk-linux.tar.xz -C "${HOME}/vulkan"
        rm -f vulkansdk-linux.tar.xz
        echo "VULKAN_SDK=${VULKAN_DIR}" >> "$GITHUB_ENV"
        echo "${VULKAN_DIR}/bin" >> "$GITHUB_PATH"
