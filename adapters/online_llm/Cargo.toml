[package]
name = "sona-online-llm"
version.workspace = true
description = "Reusable online LLM provider adapters for Sona"
authors.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.sona]
role = "outbound-adapter"

[dependencies]
aimux-core = "0.3.0"
aimux-providers = "0.3.0"
async-trait = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sona-core = { workspace = true }
tokio = { workspace = true, features = ["time"] }
urlencoding = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
