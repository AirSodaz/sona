[package]
name = "sona-api-server"
version.workspace = true
description = "Reusable HTTP API server adapter for Sona platforms"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "inbound-adapter"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["multipart", "macros", "ws"] }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = "0.13.0"
ipnet = "2.10"
log = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls", "json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sona-core = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "auth", "fs"] }
thiserror = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
