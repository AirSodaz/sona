[package]
name = "sona-sqlite"
version.workspace = true
description = "SQLite adapter for Sona core ports"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "outbound-adapter"

[features]
# Test-only repositories that reopen a `Database` (full connection pool,
# migrations, and optimize) on every call. Never enable in production builds:
# production code injects a shared `Database`/`SqliteApplicationContext`
# instead. See `DeferredSqliteHistoryMutationRepository` for the pattern
# production callers use.
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
fs3 = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sona-core = { workspace = true }
sona-application = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
sha2 = { workspace = true }
sona-sqlite = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt"] }
