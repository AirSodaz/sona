[package]
name = "sona-sqlite"
version.workspace = true
description = "SQLite adapter for Sona core ports"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "outbound-adapter"

[features]
# Test-only repositories that reopen a `Database` (full connection pool,
# migrations, and optimize) on every call. Never enable in production builds:
# production code injects a shared `Database`/`SqliteApplicationContext`
# instead. See `DeferredSqliteHistoryMutationRepository` for the pattern
# production callers use.
test-support = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
fs3 = "0.5"
log = "0.4.22"
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sona-core = { path = "../../core" }
sona-application = { path = "../../application" }
thiserror = "2.0.18"
tempfile = "3"
uuid = { version = "1", features = ["v4", "fast-rng"] }
walkdir = "2.5.0"

[dev-dependencies]
sha2 = "0.10"
sona-sqlite = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["rt"] }
