[package]
name = "sona-model-downloads"
version.workspace = true
description = "Model download adapter for Sona"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "outbound-adapter"

[dependencies]
bzip2 = { workspace = true }
flate2 = { workspace = true }
fs3 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
sona-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "macros", "signal"] }
tar = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
