[package]
name = "sona-archive"
version.workspace = true
description = "Archive filesystem adapter for Sona"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "outbound-adapter"

[dependencies]
bzip2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sona-core = { workspace = true }
sona-application = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
