[workspace]
resolver = "3"
members = [
    "application",
    "application/sync",
    "adapters/api_server",
    "adapters/archive",
    "adapters/export",
    "providers/asr/local/sherpa_onnx",
    "providers/asr/local/vad",
    "providers/asr/local/punct",
    "providers/asr/local/llama_cpp",
    "adapters/media_detector",
    "adapters/model_downloads",
    "adapters/online_llm",
    "providers/asr/online",
    "adapters/recovery_fs",
    "adapters/runtime_fs",
    "adapters/sqlite",
    "adapters/ts_bind",
    "adapters/sync_webdav",
    "core",
    "platforms/cli",
    "platforms/desktop",
    "platforms/uniffi",
    "tools/uniffi_bindgen",
]

[workspace.package]
version = "0.8.1"
authors = ["AirSodaz"]
edition = "2024"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

[profile.dev]
opt-level = 0
debug = "line-tables-only"           # line numbers only; debuginfo size -60%
split-debuginfo = "unpacked"         # faster incremental linking (Windows/macOS)

[profile.dev.package."*"]
opt-level = 2                        # optimize third-party crates (regex/crypto)

[profile.release]
opt-level = 3                        # maximize runtime performance
lto = "thin"                         # cross-crate inlining, acceptable compile time
strip = "symbols"                    # strip symbol table; binary size -20~30%
codegen-units = 1                    # single CGU for better optimization
panic = "abort"                      # no unwind overhead, smaller binary
