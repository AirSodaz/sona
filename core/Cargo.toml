[package]
name = "sona-core"
version.workspace = true
description = "Pure Rust core domain types and logic for Sona"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "core"

[features]
default = []
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
unicode-normalization = { workspace = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
chrono = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
regex = { workspace = true }
specta = { workspace = true, optional = true, features = ["derive", "serde_json"] }
specta-typescript = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
infer = { workspace = true }
jsonschema = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync"] }
