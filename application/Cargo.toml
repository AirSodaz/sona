[package]
name = "sona-application"
version.workspace = true
description = "Use-case services for Sona, coordinating core domain logic through core-owned port traits"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "application"

[dependencies]
sona-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
sona-sqlite = { path = "../adapters/sqlite" }
sona-runtime-fs = { path = "../adapters/runtime_fs" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
