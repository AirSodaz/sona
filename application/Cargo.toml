[package]
name = "sona-application"
version.workspace = true
description = "Use-case services for Sona, coordinating core domain logic through core-owned port traits"
authors.workspace = true
edition.workspace = true

[package.metadata.sona]
role = "application"

[dependencies]
sona-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["std"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
sona-sqlite = { workspace = true }
sona-runtime-fs = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
